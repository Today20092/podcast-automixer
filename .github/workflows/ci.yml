name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.arch }}) / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86-64
            machines: x86_64,amd64
            python-version: "3.11"
          - os: ubuntu-latest
            arch: x86-64
            machines: x86_64,amd64
            python-version: "3.12"
          - os: ubuntu-latest
            arch: x86-64
            machines: x86_64,amd64
            python-version: "3.13"
            package-smoke: true
          - os: ubuntu-24.04-arm
            arch: arm64
            machines: arm64,aarch64
            python-version: "3.13"
            package-smoke: true
          - os: windows-latest
            arch: AMD64
            machines: amd64,x86_64
            python-version: "3.13"
            package-smoke: true
          - os: macos-14
            arch: arm64
            machines: arm64,aarch64
            python-version: "3.13"
            package-smoke: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: uv sync --locked --dev
      - name: Verify runner architecture
        run: python -c "import platform; assert platform.machine().lower() in '${{ matrix.machines }}'.split(',')"
      - name: Run tests
        run: uv run pytest
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Build distributions
        if: matrix.package-smoke
        run: uv build
      - name: Smoke-test installed wheel command
        if: matrix.package-smoke
        run: uv run --isolated --no-project --with dist/*.whl podcast-automix --help
      - name: Smoke-test source distribution
        if: matrix.package-smoke
        run: uv run --isolated --no-project --with dist/*.tar.gz podcast-automix --help
