name: Question or other request
description: Ask a question or report something that does not fit the other forms
title: "[Question]: "
labels: [question, needs-triage]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Installation or setup
        - Usage or workflow
        - Documentation
        - Compatibility
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Question or request
      description: Explain what you are trying to accomplish and where you became stuck.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
      description: Include relevant commands, documentation, or workarounds you already tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or links if they help explain the request. Do not attach private recordings without permission.
