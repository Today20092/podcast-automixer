[project]
name = "podcast-automixer"
version = "0.1.2"
description = "Conservative offline automixing for synchronized podcast microphone stems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "Today20092" },
]
keywords = ["audio", "automixing", "podcast", "voice-activity-detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "numpy>=2.1",
  "pyloudnorm>=0.2.0",
  "pywebview>=6.2.1",
  "rich>=14.0",
  "scipy>=1.14",
  "silero-vad>=6.0",
  "soundfile>=0.13",
  "soxr>=1.0",
]

[project.urls]
Homepage = "https://github.com/Today20092/podcast-automixer"
Documentation = "https://github.com/Today20092/podcast-automixer#readme"
Issues = "https://github.com/Today20092/podcast-automixer/issues"
Source = "https://github.com/Today20092/podcast-automixer"

[project.scripts]
podcast-automix = "podcast_automixer.cli:main"
podcast-automix-desktop = "podcast_automixer.desktop:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.22.0",
  "pytest>=8.3",
  "ruff>=0.12",
  "ty>=0.0.1a21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_automixer"]

[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
