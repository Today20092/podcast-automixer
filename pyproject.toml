[project]
name = "podcast-automixer"
version = "0.1.0"
description = "Conservative offline automixing for synchronized podcast microphone stems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1",
  "rich>=14.0",
  "scipy>=1.14",
  "silero-vad>=6.0",
  "soundfile>=0.13",
]

[project.scripts]
podcast-automix = "podcast_automixer.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_automixer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

